name: Deploy to GitHub Pages

on:
  push:
    # the github-pages environment only accepts deployments from the default branch
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # never cancel a Pages deployment mid-flight — a cancelled deployment poisons
  # its commit SHA, and re-running the same SHA then fails outright
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # No build step — the game is a static ES module page that loads three.js from a CDN.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
