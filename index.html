<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DIE SHRINK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="당신의 폰 내부 기판에서 벌어지는 턴제 자원관리 퍼즐 로그라이트.">
<meta name="theme-color" content="#07090C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090C'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%234DE0D0'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%2307090C'/%3E%3C/svg%3E">

<style>
  :root {
    --ground:   #07090C;
    --panel:    #0E141B;
    --line:     #1E2B38;
    --copper:   #C87137;
    --cyan:     #4DE0D0;
    --amber:    #FFB454;
    --red:      #FF4D5E;
    --green:    #6BD98A;
    --text:     #C6D3DD;
    --muted:    #8697A6;
    --dim:      #55646F;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", "Roboto Mono", monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ground);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ───────── phone mockup ─────────
     The stage carries a transform, so every position:fixed panel inside anchors
     to it — on a phone it fills the screen and nothing changes; on a desktop it
     becomes the display of a hardware mockup. */
  #phone { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; transform: translateZ(0); background: var(--ground); }
  #phone .btn { display: none; }

  @media (min-width: 760px) and (min-height: 640px) {
    body { background: #101318; }
    #phone {
      position: fixed;
      left: 50%; top: 50%;
      width: min(432px, calc((100vh - 64px) * 0.462 + 24px));
      height: calc(100vh - 64px);
      max-height: 936px;
      transform: translate(-50%, -50%);
      /* titanium frame: two-tone rim over a soft drop */
      padding: 12px;
      border-radius: 54px;
      background: linear-gradient(160deg, #3A3F46 0%, #23272D 30%, #15181D 70%, #2C3138 100%);
      box-shadow:
        inset 0 0 0 2px #4A5058,
        inset 0 0 0 5px #0A0C0F,
        0 40px 80px -24px #000C,
        0 0 0 1px #00000066;
    }
    #stage {
      border-radius: 42px;
      box-shadow: inset 0 0 0 3px #000;   /* glass edge */
    }
    /* punch-hole camera */
    #phone::after {
      content: ""; position: absolute;
      top: 26px; left: 50%;
      width: 14px; height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #2C3A55 0 18%, #060A12 55%, #000 100%);
      box-shadow: 0 0 0 3px #05070A, inset 0 0 3px #000;
      z-index: 60;
      pointer-events: none;
    }
    /* antenna lines on the rim */
    #phone::before {
      content: ""; position: absolute; inset: 0;
      border-radius: 54px;
      background:
        linear-gradient(90deg, transparent 0 18%, #565D66 18% calc(18% + 2px), transparent 0 82%, #565D66 82% calc(82% + 2px), transparent 0) top / 100% 2px no-repeat,
        linear-gradient(90deg, transparent 0 18%, #565D66 18% calc(18% + 2px), transparent 0 82%, #565D66 82% calc(82% + 2px), transparent 0) bottom / 100% 2px no-repeat;
      pointer-events: none;
    }
    /* side keys, hung off the frame */
    #phone .btn {
      display: block; position: absolute;
      width: 4px; border-radius: 2px;
      background: linear-gradient(180deg, #4A5058, #23272D);
      box-shadow: inset 0 1px 1px #6A727C, 0 0 2px #000;
    }
    #phone .btn.pwr  { right: -4px; top: 26%; height: 84px; }
    #phone .btn.volu { left: -4px; top: 20%; height: 56px; }
    #phone .btn.vold { left: -4px; top: calc(20% + 68px); height: 56px; }

    /* the punch hole owns the top edge: readouts start below it, and the
       corner radius stops clipping the tools and the build stamp */
    #stage #top { padding-top: 46px; }
    #stage #tools { top: 46px; right: 16px; }
    #stage #build { top: 3px; }
    #stage #skills { padding-bottom: 14px; }
  }

  /* ───────── top stack ─────────
     Readouts all live at the top and flow in one column: status, then the
     inspector, then the message log. The bottom belongs to the skill dock. */
  #top {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 460px;
    z-index: 10;
    pointer-events: none;
    display: flex; flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) 12px 0;
    background: linear-gradient(180deg, #05070AF2 0%, #05070ACC 55%, #05070A66 78%, transparent 100%);
  }

  #hud {
    padding-right: 70px;   /* clear the corner tools */
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity .5s;
  }
  #hud.on { opacity: 1; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 9px;
    letter-spacing: 0.13em;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .row1 span { white-space: nowrap; }
  .row1 b { color: var(--copper); font-weight: 700; }
  .row1 .comp { color: var(--muted); letter-spacing: 0.09em; }

  .meter { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .meter .lbl { width: 34px; font-size: 8px; letter-spacing: 0.11em; color: var(--dim); flex: 0 0 auto; }
  .meter .bar {
    flex: 1; height: 8px;
    background: #0A1017;
    border: 1px solid var(--line);
    position: relative; overflow: hidden;
  }
  .meter .fill { position: absolute; inset: 0 auto 0 0; transition: width .25s cubic-bezier(.4,0,.2,1); }
  .meter .cap { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--dim); }
  /* permanently lost capacity — the battery IS the health bar */
  .meter .dead {
    position: absolute; top: 0; bottom: 0; right: 0; width: 0;
    background: repeating-linear-gradient(45deg, #05070A 0 3px, #241318 3px 6px);
  }
  .meter .val { width: 50px; text-align: right; font-size: 9.5px; color: var(--text); flex: 0 0 auto; }

  #batFill { background: linear-gradient(90deg, #1F6E68, var(--cyan)); }
  #heatFill { background: linear-gradient(90deg, #2A4A52, var(--amber)); }
  #heatFill.warm { background: linear-gradient(90deg, #6B4A1E, var(--amber)); }
  #heatFill.throttle { background: linear-gradient(90deg, #7A2530, var(--red)); }
  #heatFill.shutdown { background: var(--red); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .row3 {
    display: flex; gap: 10px;
    font-size: 9px; letter-spacing: 0.09em;
    color: var(--muted); margin-top: 6px;
  }
  .row3 b { color: var(--text); font-weight: 700; }
  .row3 .st { margin-left: auto; letter-spacing: 0.14em; }

  /* the floor's contract — what clearing or skipping is worth here */
  .row4 {
    display: flex; gap: 8px; align-items: baseline;
    margin-top: 5px; padding-top: 5px;
    border-top: 1px solid #16222C;
    font-size: 8.5px; letter-spacing: 0.09em; color: var(--dim);
  }
  .row4 #sector {
    color: var(--muted);
    min-width: 0; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .row4 #sector b { font-weight: 700; }
  .row4 #left { margin-left: auto; flex: 0 0 auto; white-space: nowrap; }
  .row4 #left b { color: var(--text); font-weight: 700; }
  .st.nominal { color: var(--dim); }
  .st.warm { color: var(--amber); }
  .st.throttle { color: var(--red); }
  .st.shutdown { color: var(--red); animation: blink .5s steps(2) infinite; }

  /* ───────── toasts ─────────
     Explanations hover over the scene on the side the player is not: they never
     take layout space and never sit on the tile you are about to tap. */
  #toasts {
    position: fixed;
    left: 10px; right: 10px;
    z-index: 15;
    display: flex; flex-direction: column;
    gap: 5px;
    pointer-events: none;
    transition: top .25s, bottom .25s;
  }
  #toasts > div { max-width: 436px; width: 100%; margin: 0 auto; }

  /* ───────── inspector ───────── */
  #inspect {
    margin-top: 0;
    background: #0B1219F2;
    border: 1px solid var(--line);
    border-left: 2px solid var(--cyan);
    padding: 7px 10px;
    font-size: 9.5px;
    line-height: 1.55;
    letter-spacing: 0.03em;
    opacity: 0;
    max-height: 0; overflow: hidden;
    transform: translateY(-6px);
    transition: opacity .18s, transform .18s, max-height .18s, margin-top .18s, padding .18s;
    padding-top: 0; padding-bottom: 0;
  }
  #inspect.on {
    opacity: 1; transform: translateY(0);
    max-height: 130px; padding-top: 7px; padding-bottom: 7px;
  }
  #inspect.lethal { border-left-color: var(--red); }
  #inspect .nm { color: var(--text); font-weight: 700; letter-spacing: 0.1em; }
  #inspect .dt { color: var(--muted); }
  #inspect b.c { color: var(--cyan); font-weight: 400; }
  #inspect b.r { color: var(--red); font-weight: 400; }
  #inspect b.g { color: var(--green); font-weight: 400; }
  #inspect b.a { color: var(--amber); font-weight: 400; }

  /* ───────── what you are carrying ───────── */
  #buffs {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 6px;
  }
  #buffs:empty { display: none; }
  .bf {
    display: flex; align-items: baseline; gap: 4px;
    padding: 3px 6px 3px 5px;
    background: #0C131AE6;
    border: 1px solid var(--line);
    border-left: 2px solid var(--dim);
    font-size: 8px; letter-spacing: 0.1em;
    color: var(--muted);
  }
  .bf .v { font-size: 9.5px; font-weight: 700; color: var(--text); letter-spacing: 0; }
  .bf.c { border-left-color: var(--cyan); } .bf.c .v { color: var(--cyan); }
  .bf.g { border-left-color: var(--green); } .bf.g .v { color: var(--green); }
  .bf.a { border-left-color: var(--amber); } .bf.a .v { color: var(--amber); }
  .bf.r { border-left-color: var(--red); } .bf.r .v { color: var(--red); }
  .bf.pulse { animation: bfp 1.1s ease-in-out infinite; }
  @keyframes bfp { 50% { box-shadow: 0 0 12px #4DE0D055; } }

  /* ───────── upgrade picker ───────── */
  .picks { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .pick {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 11px;
    background: #0C131AF7;
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    color: var(--text);
    text-align: left;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0;
    transition: border-color .12s, background .12s, transform .08s;
  }
  .pick:hover { background: #12202AF7; border-color: var(--cyan); }
  .pick .ax {
    flex: 0 0 auto; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid currentColor;
    font-size: 11px; font-weight: 700;
  }
  .pick .bd { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .pick .pn { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; }
  .pick .pd { font-size: 10px; color: var(--muted); }
  .pick .pnote { font-family: var(--sans); font-size: 10px; line-height: 1.4; color: var(--dim); }
  .pick .cur { flex: 0 0 auto; font-size: 8.5px; color: var(--dim); letter-spacing: 0.06em; }
  .pick.c { border-left-color: var(--cyan); } .pick.c .ax { color: var(--cyan); }
  .pick.g { border-left-color: var(--green); } .pick.g .ax { color: var(--green); }
  .pick.a { border-left-color: var(--amber); } .pick.a .ax { color: var(--amber); }
  .pick.r { border-left-color: var(--red); } .pick.r .ax { color: var(--red); }

  /* ───────── log ───────── */
  #log {
    background: #0B1219E8;
    border: 1px solid #16222C;
    padding: 5px 9px;
    font-size: 9px;
    line-height: 1.55;
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0;
    transition: opacity .5s;
  }
  #log.on { opacity: 1; }
  #log:empty { display: none; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .fresh { color: var(--text); }
  #log b.c { color: var(--cyan); font-weight: 400; }
  #log b.r { color: var(--red); font-weight: 400; }
  #log b.a { color: var(--amber); font-weight: 400; }
  #log b.g { color: var(--green); font-weight: 400; }

  /* ───────── skill dock ───────── */
  #skills {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 100%; max-width: 460px;
    z-index: 14;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 6px;
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, #05070AF7 0%, #05070AE8 62%, transparent 100%);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
  }
  #skills.on { opacity: 1; pointer-events: auto; }

  .sk {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    min-height: 50px;
    padding: 6px 4px 5px;
    background: #0C131AF2;
    border: 1px solid var(--line);
    border-top: 2px solid #24596A;
    color: var(--text);
    cursor: pointer;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .12s, box-shadow .12s, transform .08s, background .12s;
  }
  /* pad fingers along the bottom edge — the slot reads as a chip footprint */
  .sk::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 2px;
    background: repeating-linear-gradient(90deg, #6E5A2E 0 6px, transparent 6px 11px);
    opacity: .8;
  }
  .sk .nm { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; }
  .sk .ef {
    font-family: var(--sans); font-size: 8px; line-height: 1.2;
    color: var(--muted); letter-spacing: 0; text-align: center;
  }
  .sk .cost { font-size: 8px; letter-spacing: 0.05em; color: var(--amber); }

  .sk:active { transform: translateY(1px); }
  .sk.ready { border-top-color: var(--cyan); }
  .sk.ready:hover { border-color: var(--cyan); box-shadow: 0 0 18px #4DE0D033, inset 0 0 12px #4DE0D014; }
  .sk.armed {
    border-color: var(--cyan); border-top-color: var(--cyan);
    background: #10222BF2;
    box-shadow: 0 0 22px #4DE0D055, inset 0 0 14px #4DE0D022;
  }
  .sk.armed .nm { color: var(--cyan); }
  .sk.off { color: var(--dim); border-color: #16202A; border-top-color: #16202A; cursor: default; }
  .sk.off .ef { color: #3E4A54; }
  .sk.off .cost { color: var(--dim); }

  /* cooldown: the slot drains from the top like a discharging cap */
  .sk .cd {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #060A0ECC;
    font-size: 16px; font-weight: 700; color: var(--cyan);
    letter-spacing: 0; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px #4DE0D066;
  }
  .sk .cd::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0;
    height: var(--f, 100%);
    background: #4DE0D014;
    border-bottom: 1px solid #4DE0D044;
  }

  /* ───────── overlay ───────── */
  #over {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: center; justify-content: center;
    padding: 30px 24px;
    background: #05070AF7;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  #over.on { display: flex; }
  .card {
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column;
    align-items: center; gap: 15px;
    text-align: center;
  }
  .card h1 {
    font-size: 19px; letter-spacing: 0.3em; font-weight: 700;
    color: var(--cyan); text-shadow: 0 0 28px #4DE0D055;
    text-wrap: balance;
  }
  .card h1.dead { color: var(--red); text-shadow: 0 0 28px #FF4D5E55; }
  .card .sub { font-size: 8.5px; letter-spacing: 0.22em; color: var(--dim); }
  .card p {
    font-family: var(--sans); font-size: 11.5px; line-height: 1.7;
    color: var(--muted); letter-spacing: 0;
  }
  .card p b { color: var(--text); font-weight: 600; }
  .card p b.c { color: var(--cyan); }

  .legend { display: flex; flex-direction: column; gap: 11px; width: 100%; text-align: left; }
  .lg { display: flex; gap: 10px; align-items: center; font-family: var(--sans); font-size: 11px; line-height: 1.5; color: var(--muted); letter-spacing: 0; }
  .lg b { color: var(--text); font-weight: 600; }
  .sw { flex: 0 0 auto; width: 26px; height: 26px; position: relative; }
  .sw::after {
    content: ""; position: absolute; inset: 0;
    background: var(--c);
    box-shadow: 0 0 14px var(--c);
    transform: skewY(-14deg) scaleY(.62);
  }
  .sw.tall::after { transform: skewY(-14deg) scaleY(.62) translateY(-4px); box-shadow: 0 5px 0 -1px #00000088, 0 0 14px var(--c); }
  .sw.ring::after { border-radius: 50%; background: none; border: 3px solid var(--c); }

  .stats { display: grid; grid-template-columns: auto auto; gap: 5px 22px; font-size: 10.5px; letter-spacing: 0.1em; color: var(--dim); font-variant-numeric: tabular-nums; width: 100%; }
  .stats span:nth-child(even) { text-align: right; color: var(--text); }

  button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    padding: 11px 26px; border: none; cursor: pointer;
    color: var(--ground); background: var(--cyan);
    transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.14); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* ───────── coach ───────── */
  #coach {
    align-self: center;
    margin-top: 0;
    max-width: min(330px, 100%);
    padding: 8px 13px;
    background: #0B1219F5;
    border: 1px solid var(--cyan);
    box-shadow: 0 0 26px #4DE0D022, 0 8px 24px -10px #000;
    font-family: var(--sans);
    font-size: 11px; line-height: 1.55;
    color: var(--text); letter-spacing: 0;
    text-align: center;
    opacity: 0;
    max-height: 0; overflow: hidden;
    padding-top: 0; padding-bottom: 0;
    transform: translateY(-6px);
    transition: opacity .3s, transform .3s, max-height .3s, padding .3s;
  }
  #coach.on {
    opacity: 1; transform: translateY(0);
    max-height: 90px; padding-top: 8px; padding-bottom: 8px;
  }
  #coach b { color: var(--cyan); font-weight: 600; }

  /* ───────── home screen ─────────
     A believable phone face. Tapping the game's icon is what "launches" the
     dungeon: the home layer zooms and dissolves, and the boot dive begins. */
  #home {
    position: fixed; inset: 0; z-index: 33;
    display: flex; flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 90% at 82% -10%, #1E3A5C 0%, transparent 55%),
      radial-gradient(110% 80% at 12% 108%, #14343A 0%, transparent 60%),
      linear-gradient(165deg, #0A1018 0%, #0B0E16 45%, #060A10 100%);
    transition: opacity .6s, transform .6s cubic-bezier(.4,0,.2,1);
  }
  #home.gone { opacity: 0; transform: scale(1.55); pointer-events: none; }

  .stbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 8px 10px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: #E8EDF2;
  }
  .stbar .stR { font-size: 10px; font-weight: 400; color: #C8D2DA; letter-spacing: 0.06em; }

  .apps {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: min-content;
    gap: 20px 8px;
    padding-top: 12px;
    align-content: start;
  }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .app .ic {
    width: 52px; height: 52px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--bg, #2A313A);
    box-shadow: inset 0 1px 1px #FFFFFF22, 0 4px 10px -4px #000C;
    transition: transform .12s;
  }
  .app:active .ic { transform: scale(0.9); }
  .app .lb {
    font-family: var(--sans); font-size: 9.5px; letter-spacing: 0;
    color: #DDE4EA; text-shadow: 0 1px 2px #000A;
    white-space: nowrap;
  }
  .app.deny .ic { animation: deny .35s; }
  @keyframes deny { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* the one icon that matters — the favicon made physical */
  .app.game .ic {
    background: #07090C;
    box-shadow: inset 0 0 0 1.5px #4DE0D0, 0 0 18px #4DE0D055, 0 4px 10px -4px #000C;
    position: relative;
  }
  .app.game .ic::before {
    content: ""; width: 22px; height: 22px; background: #4DE0D0;
  }
  .app.game .ic::after {
    content: ""; position: absolute; width: 9px; height: 9px; background: #07090C;
  }
  .app.game .lb { color: #4DE0D0; font-weight: 600; }

  .dots { display: flex; justify-content: center; gap: 7px; padding: 10px 0 12px; }
  .dots .d { width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF38; }
  .dots .d.on { background: #FFFFFFB4; }

  .dock {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px 10px;
    border-radius: 24px;
    background: #FFFFFF14;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }

  /* ───────── boot ───────── */
  #bootText {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    font-size: 9px; letter-spacing: 0.24em;
    color: var(--cyan);
    text-shadow: 0 0 16px #4DE0D077;
    text-align: center; line-height: 2.2;
    opacity: 0; transition: opacity .5s;
    pointer-events: none; white-space: nowrap;
  }
  #bootText.big { font-size: 17px; letter-spacing: 0.4em; }

  #skip {
    position: fixed; right: 16px; bottom: 16px; z-index: 34;   /* above the home layer */
    font-size: 8.5px; letter-spacing: 0.18em; color: var(--dim);
    background: none; padding: 10px; box-shadow: none;
  }
  #skip:hover { color: var(--cyan); }
  #skip.gone { display: none; }

  /* ───────── corner ───────── */
  #tools {
    position: fixed; z-index: 12;
    top: max(10px, env(safe-area-inset-top)); right: 10px;
    display: flex; gap: 6px;
    opacity: 0; transition: opacity .5s;
  }
  #tools.on { opacity: 1; }
  #tools button {
    width: 27px; height: 27px; padding: 0;
    font-size: 10px; letter-spacing: 0;
    color: var(--dim); background: #0E141BDD;
    border: 1px solid var(--line);
  }
  #tools button:hover { color: var(--cyan); border-color: var(--cyan); }

  /* build stamp — 날짜.커밋 */
  #build {
    position: fixed; z-index: 12;
    top: max(2px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    font-size: 7.5px; letter-spacing: 0.08em;
    color: #3E4A54;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 900px) {
    #top { max-width: 520px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
