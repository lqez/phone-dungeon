name: Publish web/ to gh-pages

# GitHub Pages serves the gh-pages branch (legacy source), not an Actions artifact.
# The artifact route kept stalling in `deployment_queued` on this repo, so this job
# just splits web/ onto gh-pages and lets Pages build it the ordinary way.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split web/ onto gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix web -b gh-pages-build
          git push -f origin gh-pages-build:gh-pages
