<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DIE SHRINK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="당신의 폰 내부 기판에서 벌어지는 턴제 자원관리 퍼즐 로그라이트.">
<meta name="theme-color" content="#07090C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090C'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%234DE0D0'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%2307090C'/%3E%3C/svg%3E">

<style>
  :root {
    --ground:   #07090C;
    --panel:    #0E141B;
    --line:     #1E2B38;
    --copper:   #C87137;
    --cyan:     #4DE0D0;
    --amber:    #FFB454;
    --red:      #FF4D5E;
    --green:    #6BD98A;
    --text:     #C6D3DD;
    --muted:    #8697A6;
    --dim:      #55646F;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", "Roboto Mono", monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ground);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ───────── HUD ───────── */
  #hud {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    padding-right: 82px;   /* clear the corner tools */
    z-index: 10;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #05070AEE 0%, #05070ACC 60%, transparent 100%);
    opacity: 0;
    transition: opacity .5s;
  }
  #hud.on { opacity: 1; }

  .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--dim);
    margin-bottom: 7px;
  }
  .row1 b { color: var(--copper); font-weight: 700; }
  .row1 .comp { color: var(--muted); letter-spacing: 0.1em; }

  .meter { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .meter .lbl { width: 40px; font-size: 9px; letter-spacing: 0.12em; color: var(--dim); flex: 0 0 auto; }
  .meter .bar {
    flex: 1; height: 10px;
    background: #0A1017;
    border: 1px solid var(--line);
    position: relative; overflow: hidden;
  }
  .meter .fill { position: absolute; inset: 0 auto 0 0; transition: width .25s cubic-bezier(.4,0,.2,1); }
  .meter .cap { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--dim); }
  .meter .val { width: 58px; text-align: right; font-size: 11px; color: var(--text); flex: 0 0 auto; }

  #batFill { background: linear-gradient(90deg, #1F6E68, var(--cyan)); }
  #heatFill { background: linear-gradient(90deg, #2A4A52, var(--amber)); }
  #heatFill.warm { background: linear-gradient(90deg, #6B4A1E, var(--amber)); }
  #heatFill.throttle { background: linear-gradient(90deg, #7A2530, var(--red)); }
  #heatFill.shutdown { background: var(--red); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .row3 {
    display: flex; gap: 12px;
    font-size: 10px; letter-spacing: 0.1em;
    color: var(--muted); margin-top: 7px;
  }
  .row3 b { color: var(--text); font-weight: 700; }
  .row3 .st { margin-left: auto; letter-spacing: 0.16em; }
  .st.nominal { color: var(--dim); }
  .st.warm { color: var(--amber); }
  .st.throttle { color: var(--red); }
  .st.shutdown { color: var(--red); animation: blink .5s steps(2) infinite; }

  /* ───────── inspector ───────── */
  #inspect {
    position: fixed;
    left: 50%; transform: translateX(-50%) translateY(-8px);
    top: 118px;
    width: calc(100% - 28px); max-width: 432px;
    z-index: 11;
    background: #0B1219F2;
    border: 1px solid var(--line);
    border-left: 2px solid var(--cyan);
    padding: 9px 12px;
    font-size: 11px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s, transform .18s;
  }
  #inspect.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #inspect.lethal { border-left-color: var(--red); }
  #inspect .nm { color: var(--text); font-weight: 700; letter-spacing: 0.1em; }
  #inspect .dt { color: var(--muted); }
  #inspect b.c { color: var(--cyan); font-weight: 400; }
  #inspect b.r { color: var(--red); font-weight: 400; }
  #inspect b.g { color: var(--green); font-weight: 400; }
  #inspect b.a { color: var(--amber); font-weight: 400; }

  /* ───────── log ───────── */
  #log {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 460px;
    padding: 10px 14px max(12px, env(safe-area-inset-bottom));
    z-index: 10;
    pointer-events: none;
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--muted);
    background: linear-gradient(0deg, #05070AEE 0%, #05070ACC 55%, transparent 100%);
    opacity: 0;
    transition: opacity .5s;
  }
  #log.on { opacity: 1; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .fresh { color: var(--text); }
  #log b.c { color: var(--cyan); font-weight: 400; }
  #log b.r { color: var(--red); font-weight: 400; }
  #log b.a { color: var(--amber); font-weight: 400; }
  #log b.g { color: var(--green); font-weight: 400; }

  /* ───────── radial ───────── */
  #radial {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    background: #05070ACC;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  #radial.on { display: block; }
  .slot {
    position: absolute;
    width: 78px; height: 78px;
    margin: -39px 0 0 -39px;
    border-radius: 50%;
    background: #0E141BEE;
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    font-size: 10px; letter-spacing: 0.1em;
    color: var(--text);
    cursor: pointer;
    transition: transform .13s cubic-bezier(.34,1.56,.64,1), border-color .13s, box-shadow .13s;
    transform: scale(.4);
  }
  #radial.on .slot { transform: scale(1); }
  .slot .cost { font-size: 9px; color: var(--amber); letter-spacing: 0.06em; }
  .slot.hot { border-color: var(--cyan); box-shadow: 0 0 22px #4DE0D055, inset 0 0 14px #4DE0D01A; transform: scale(1.12); }
  .slot.off { color: var(--dim); border-color: #17222C; }
  .slot.off .cost { color: var(--dim); }
  .hubc {
    position: absolute;
    width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: #0B1219EE;
    border: 1px solid var(--cyan);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--dim); letter-spacing: 0.1em;
    cursor: pointer;
  }
  #radialDesc {
    position: absolute; left: 50%; bottom: 16%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.06em;
    color: var(--text); white-space: nowrap;
    text-shadow: 0 2px 12px #000;
  }

  /* ───────── overlay ───────── */
  #over {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: center; justify-content: center;
    padding: 30px 24px;
    background: #05070AF7;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  #over.on { display: flex; }
  .card {
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column;
    align-items: center; gap: 15px;
    text-align: center;
  }
  .card h1 {
    font-size: 22px; letter-spacing: 0.32em; font-weight: 700;
    color: var(--cyan); text-shadow: 0 0 28px #4DE0D055;
    text-wrap: balance;
  }
  .card h1.dead { color: var(--red); text-shadow: 0 0 28px #FF4D5E55; }
  .card .sub { font-size: 9.5px; letter-spacing: 0.24em; color: var(--dim); }
  .card p {
    font-family: var(--sans); font-size: 13px; line-height: 1.75;
    color: var(--muted); letter-spacing: 0;
  }
  .card p b { color: var(--text); font-weight: 600; }
  .card p b.c { color: var(--cyan); }

  .legend { display: flex; flex-direction: column; gap: 11px; width: 100%; text-align: left; }
  .lg { display: flex; gap: 11px; align-items: center; font-family: var(--sans); font-size: 12.5px; line-height: 1.5; color: var(--muted); letter-spacing: 0; }
  .lg b { color: var(--text); font-weight: 600; }
  .sw { flex: 0 0 auto; width: 26px; height: 26px; position: relative; }
  .sw::after {
    content: ""; position: absolute; inset: 0;
    background: var(--c);
    box-shadow: 0 0 14px var(--c);
    transform: skewY(-14deg) scaleY(.62);
  }
  .sw.tall::after { transform: skewY(-14deg) scaleY(.62) translateY(-4px); box-shadow: 0 5px 0 -1px #00000088, 0 0 14px var(--c); }
  .sw.ring::after { border-radius: 50%; background: none; border: 3px solid var(--c); }

  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 24px; font-size: 11.5px; letter-spacing: 0.1em; color: var(--dim); font-variant-numeric: tabular-nums; width: 100%; }
  .stats span:nth-child(even) { text-align: right; color: var(--text); }

  button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
    padding: 13px 30px; border: none; cursor: pointer;
    color: var(--ground); background: var(--cyan);
    transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.14); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* ───────── coach ───────── */
  #coach {
    position: fixed; left: 50%; bottom: 82px;
    transform: translateX(-50%) translateY(10px);
    z-index: 15;
    max-width: min(340px, calc(100% - 32px));
    padding: 11px 16px;
    background: #0B1219F5;
    border: 1px solid var(--cyan);
    box-shadow: 0 0 34px #4DE0D022, 0 10px 30px -10px #000;
    font-family: var(--sans);
    font-size: 13px; line-height: 1.6;
    color: var(--text); letter-spacing: 0;
    text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .35s, transform .35s;
  }
  #coach.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #coach b { color: var(--cyan); font-weight: 600; }

  /* ───────── boot ───────── */
  #bootText {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    font-size: 10px; letter-spacing: 0.26em;
    color: var(--cyan);
    text-shadow: 0 0 16px #4DE0D077;
    text-align: center; line-height: 2.2;
    opacity: 0; transition: opacity .5s;
    pointer-events: none; white-space: nowrap;
  }
  #bootText.big { font-size: 20px; letter-spacing: 0.44em; }

  #skip {
    position: fixed; right: 16px; bottom: 16px; z-index: 31;
    font-size: 9px; letter-spacing: 0.2em; color: var(--dim);
    background: none; padding: 10px; box-shadow: none;
  }
  #skip:hover { color: var(--cyan); }
  #skip.gone { display: none; }

  /* ───────── corner ───────── */
  #tools {
    position: fixed; z-index: 12;
    top: max(12px, env(safe-area-inset-top)); right: 12px;
    display: flex; gap: 6px;
    opacity: 0; transition: opacity .5s;
  }
  #tools.on { opacity: 1; }
  #tools button {
    width: 30px; height: 30px; padding: 0;
    font-size: 11px; letter-spacing: 0;
    color: var(--dim); background: #0E141BDD;
    border: 1px solid var(--line);
  }
  #tools button:hover { color: var(--cyan); border-color: var(--cyan); }

  @media (min-width: 900px) {
    #hud, #log { max-width: 520px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud">
  <div class="row1">
    <span>DEPTH <b id="depth">01</b></span>
    <span class="comp" id="comp">—</span>
    <span>HEALTH <b id="health">100</b>%</span>
  </div>
  <div class="meter">
    <span class="lbl">BATT</span>
    <span class="bar"><span class="fill" id="batFill"></span><span class="cap" id="batCap"></span></span>
    <span class="val" id="batVal">10/10</span>
  </div>
  <div class="meter">
    <span class="lbl">HEAT</span>
    <span class="bar"><span class="fill" id="heatFill"></span></span>
    <span class="val" id="heatVal">0</span>
  </div>
  <div class="row3">
    <span>LV <b id="lv">1</b></span>
    <span>ATK <b id="atk">5</b></span>
    <span>XP <b id="xp">0/5</b></span>
    <span class="st nominal" id="stt">NOMINAL</span>
  </div>
</div>

<div id="inspect"></div>

<div id="tools">
  <button id="helpBtn" title="도움말" aria-label="도움말">?</button>
  <button id="camBtn" title="시점 전환" aria-label="시점 전환">◱</button>
</div>

<div id="coach"></div>
<div id="log"></div>

<div id="radial">
  <div id="radialDesc"></div>
</div>

<div id="over"><div class="card" id="overCard"></div></div>

<div id="bootText"></div>
<button id="skip">^C</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
  }
}
</script>
<script type="module" src="./game.js"></script>

</body>
</html>
